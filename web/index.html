<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Mahlzeit — Menüplan Stuttgart-Vaihingen</title>
    <link rel="stylesheet" href="style.css">
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("mahlzeit-theme");
        } catch (_) {}
        var theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = theme;
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <h1>Mahlzeit</h1>
      <p class="freshness" id="freshness"></p>
      <div class="stale hidden" id="stale-warning" role="alert"></div>
      <div class="controls">
        <label class="filter">
          <input type="checkbox" id="veggie-filter">
          <span>Nur vegetarisch / vegan</span>
        </label>
        <button type="button" id="theme-toggle" class="theme-toggle"
          aria-pressed="false">Dunkelmodus</button>
      </div>
      <nav class="view-tabs" id="view-tabs" aria-label="Ansicht">
        <button type="button" data-view="daily" aria-pressed="true">Täglich</button>
        <button type="button" data-view="weekly" aria-pressed="false">Wöchentlich</button>
      </nav>
      <nav class="week-nav hidden" id="week-nav" aria-label="Wochen"></nav>
    </header>
    <main>
      <section class="daily-view" id="daily-view"></section>
      <section class="columns hidden" id="columns"></section>
    </main>
    <footer class="site-footer">
      <p>Mahlzeit — lokales Projekt. Inhalte stammen aus den Wochenkarten der Restaurants
        (faktenbasierte Übernahme); Links führen zum jeweiligen Original.</p>
      <nav class="footer-links" aria-label="Rechtliches">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
